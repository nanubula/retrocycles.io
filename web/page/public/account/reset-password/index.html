<!doctype html>
<!-- The platform's reset-password email link lands here: <page>/account/reset-password?userId=..&token=..
     (platform-contract/README.md "Email links"; a static host serves this file for the
     directory). The play page is one page at the root, so this passes the parameters on
     to /?account=reset-password&userId=..&token=.. (App.tsx reads and removes them) with
     location.replace, so the token does not stay in the history. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Retrocycles</title>
<link rel="stylesheet" href="../../plain.css">
<script src="../forward.js" data-kind="reset-password"></script>
</head>
<body></body>
</html>
